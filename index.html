<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 주택 취득세 감면 계산기 | 생활ZIP</title><style>body{font-family:system-ui,'Malgun Gothic',sans-serif;max-width:600px;margin:30px auto;padding:16px;color:#222}h1{font-size:25px}label{display:block;margin:18px 0 6px;font-weight:700}input,select{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccc;border-radius:9px;font-size:17px}.result{background:#f4f5f7;padding:20px;border-radius:15px;margin-top:25px}.total{font-size:28px;font-weight:800}.line{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #ddd}.note{color:#555;font-size:13px;line-height:1.7}button{margin-top:15px;border:0;border-radius:9px;background:#222;color:white;padding:13px;width:100%;cursor:pointer}</style></head><body><h1>🏠 2026 주택 취득세 계산기</h1><p>생애최초·출산가구 감면액을 비교해 보세요.</p><label for="price">주택 취득가격 (만원)</label><input id="price" type="number" value="50000" min="0"><label for="area">전용면적</label><select id="area"><option value="small">85㎡ 이하</option><option value="large">85㎡ 초과</option></select><label for="benefit">취득세 감면</label><select id="benefit"><option value="none">감면 없음</option><option value="first" selected>생애최초 일반주택 (최대 200만원)</option><option value="special">생애최초 소형 비아파트 등 (최대 300만원)</option><option value="birth">출산·양육 (최대 500만원)</option></select><label><input id="eligible" type="checkbox" checked style="width:auto"> 해당 감면의 법적 요건을 모두 충족한다고 가정</label><div class="result"><div>예상 총 납부세액</div><div class="total" id="total"></div><div id="lines"></div></div><p class="note">※ 일반적인 개인 1주택 유상취득 표준세율을 가정한 참고용 계산기입니다. 지방교육세·농어촌특별세 감면 연동, 최소납부세제, 다주택 중과, 개별 특례 및 사후 추징을 정확히 반영하지 않습니다. 실제 납부세액은 위택스 및 관할 구청에서 확인하세요. 감면 선택만으로 수급 자격이 인정되지는 않습니다.</p><button onclick="navigator.clipboard?.writeText(document.getElementById('total').textContent)">예상 납부액 복사</button><script>const $=id=>document.getElementById(id),won=n=>Math.round(n).toLocaleString('ko-KR')+'원';function calc(){const p=Math.max(0,Number($('price').value)||0),r=p<=60000?1:p<=90000?p/10000*2/3-3:3,base=Math.round(p*10000*r/100),ed=Math.round(base*.1),ru=$('area').value==='large'?Math.round(p*10000*.002):0,limits={none:0,first:2000000,special:3000000,birth:5000000},relief=$('eligible').checked&&p<=120000?Math.min(base,limits[$('benefit').value]):0;let total=base-relief+ed+ru;$('total').textContent=won(total);$('lines').innerHTML=[['기본 취득세 ('+r.toFixed(2)+'%)',base],['취득세 감면',-relief],['감면 후 취득세',base-relief],['지방교육세 (잠정)',ed],['농어촌특별세 (잠정)',ru]].map(([name,n])=>'<div class="line"><span>'+name+'</span><strong>'+won(n)+'</strong></div>').join('')}document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',calc));calc();</script></body></html>
